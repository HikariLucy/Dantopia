name: Feature / tarea técnica
description: Planificar una modificación trazable
title: "[P#] "
labels: []
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué problema soluciona y en qué fase
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
